# Example nginx site for radr.nxtdev.xyz
# Place under /etc/nginx/sites-available/ and symlink to sites-enabled.
# Then: sudo certbot --nginx -d radr.nxtdev.xyz

server {
    listen 80;
    server_name radr.nxtdev.xyz;

    # Team site at /flo-logistics (and its assets)
    location /flo-logistics/demo/ {
        proxy_pass http://127.0.0.1:3000/flo-logistics/demo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /flo-logistics/ {
        proxy_pass http://127.0.0.1:3001/flo-logistics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /flo-logistics {
        return 301 /flo-logistics/;
    }
}
