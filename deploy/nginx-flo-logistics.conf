# Quasarian FLO — nginx locations for radr.nxtdev.xyz
# Include inside the HTTPS server block BEFORE the catch-all `location /`.
# Example: include /etc/nginx/snippets/flo-logistics.conf;

# More-specific demo path first
location ^~ /flo-logistics/demo {
    # Allow camera for warehouse CV demos (overrides server-level if needed)
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header X-Powered-By;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    client_max_body_size 10m;
}

location ^~ /flo-logistics {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header X-Powered-By;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    client_max_body_size 25m;
}
